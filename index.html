<style>
:root{--bg:#f6f4ef;--fg:#23221f;--mut:#6d6a62;--card:#fff;--line:#dedad0;--acc:#2f5d62;--accfg:#fff;--ok:#2e7d4f;--bad:#b3392f;--sel:#e3eeee;--imgfilter:none}
:root[data-theme="dark"]{--bg:#1a1c1a;--fg:#e8e6df;--mut:#9a978e;--card:#232623;--line:#363a34;--acc:#7fb5ba;--accfg:#10201f;--ok:#6fcf97;--bad:#ef7f74;--sel:#2a3d3e;--imgfilter:brightness(.82) contrast(.95)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
a{color:var(--acc)}button,select,textarea{font:inherit;color:inherit}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;cursor:pointer}header .sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--card);font-size:13px}.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rc{text-align:left;padding:10px}.rc b{font-size:15px}.rc small{display:block;color:var(--mut)}
.qimg{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.qimg img{display:block;width:100%;height:auto;filter:var(--imgfilter)}
.opts{display:flex;gap:8px;margin:12px 0}.opts button{flex:1;padding:12px 0;font-size:18px;font-weight:700}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.opts button.key{outline:3px solid var(--ok)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px;margin-bottom:8px}
.tag{padding:1px 8px;border-radius:99px;background:var(--sel);color:var(--fg);font-size:12px}
.wn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}@media(max-width:760px){.wn{grid-template-columns:1fr}}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}

   <div class="row"><b>회차</b><div class="chips">${rs.map(r=>`<span class="chip ${cfg.rounds.has(r)?'on':''}" onclick="tg('rounds',${r})">${r}</span>`).join('')}</div></div>
   <div class="row"><b>문항 수</b><select onchange="cfg.n=+this.value">${[10,20,30,50].map(n=>`<option ${cfg.n==n?'selected':''}>${n}</option>`).join('')}</select>
    <b>대상</b><select onchange="cfg.mode=this.value"><option value="all" ${cfg.mode=='all'?'selected':''}>전체</option><option value="new" ${cfg.mode=='new'?'selected':''}>안 푼 문제만</option><option value="wrong" ${cfg.mode=='wrong'?'selected':''}>틀린 적 있는 문제만</option></select>
    <button class="p" onclick="startQuiz()">시작</button></div></div>
  <div class="card"><h2>회차별 풀기 · 시험지 그대로 보기</h2><div class="grid">${rs.map(r=>`<div class="card rc" style="margin:0"><b>제${r}회</b><small>${D.rounds[r].ok?'정답표 있음':'정답표 없음'}</small>
   <button onclick="startRound(${r})" ${D.rounds[r].ok?'':'disabled'}>순서대로 풀기</button> <a href="pages.html#r${r}" target="_blank" class="sub">시험지</a></div>`).join('')}</div></div>
  <div class="card"><h2>백업</h2><div class="sub">기록은 이 브라우저에만 저장돼요. 기기를 바꿀 땐 내보내기 → 가져오기를 쓰세요.</div>
   <div class="row"><button onclick="exp()">기록 내보내기</button><input type="file" accept=".json" onchange="imp(this)"></div></div>`;
}
function tg(k,v){const s=cfg[k];s.has(v)?s.delete(v):s.add(v);home()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rec)],{type:'application/json'}));a.download='hanneungeom-record.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{rec=Object.assign(rec,JSON.parse(r.result));save();home();alert('가져왔어요')}catch(e){alert('파일을 읽지 못했어요')}};r.readAsText(f)}
let sess=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ordered(list){return shuffle(list).sort((a,b)=>ERAS.indexOf(era(a))-ERAS.indexOf(era(b)))}
function startQuiz(){
  let pool=Q.filter(q=>q.a&&(!cfg.eras.size||cfg.eras.has(era(q)))&&(!cfg.rounds.size||cfg.rounds.has(q.r)));
  if(cfg.mode==='new')pool=pool.filter(q=>!rec[q.id]||!rec[q.id].t);
  if(cfg.mode==='wrong')pool=pool.filter(q=>rec[q.id]&&rec[q.id].w>0);
  if(!pool.length){alert('조건에 맞는 문항이 없어요');return}
  begin(ordered(shuffle(pool).slice(0,cfg.n)),'섞어 풀기 · 시대 순')}
function startRound(r){begin(Q.filter(q=>q.r===r&&q.a),'제'+r+'회')}
function begin(list,title){sess={list,i:0,title,res:[],picked:null};go('quiz');route()}
function quizView(){
  const s=sess;if(s.i>=s.list.length)return result();
  const q=s.list[s.i];
  $('#app').innerHTML=`<div class="meta"><b>${s.title}</b><span>${s.i+1} / ${s.list.length}</span><span class="tag">제${q.r}회 ${q.n}번</span><span class="tag">${era(q)}</span></div>
  <div class="bar"><i style="width:${s.i/s.list.length*100}%"></i></div>
  <div class="qimg"><img src="q/${q.id}.jpg" alt="문항"></div>
  <div class="opts">${[1,2,3,4,5].map(k=>`<button id="o${k}" onclick="pick(${k})">${k}</button>`).join('')}</div>
  <div id="fb"></div>`;
  window.scrollTo(0,0);
}
addEventListener('keydown',e=>{if(!sess||location.hash!=='#quiz'||sess.i>=sess.list.length)return;
  if(e.key>='1'&&e.key<='5'&&sess.picked==null)pick(+e.key);else if((e.key==='Enter'||e.key==='ArrowRight')&&sess.picked!=null)nextQ()});
function pick(k){const s=sess,q=s.list[s.i];if(s.picked!=null)return;s.picked=k;
  const ok=k===q.a,r=R(q.id);r.t++;if(!ok){r.w++;r.last=k;r.done=0}
  s.res.push({id:q.id,k,ok});save();
  for(let b=1;b<=5;b++){const el=$('#o'+b);el.disabled=true;if(b===q.a)el.classList.add(ok?'right':'key');if(b===k&&!ok)el.classList.add('wrong')}
  $('#fb').innerHTML=`<div class="card"><b class="${ok?'good':'badc'}">${ok?'정답!':'오답 · 정답은 '+q.a+'번'}</b> ${ok?'':'<span class="sub">오답노트에 저장됐어요</span>'}
   <div class="row"><button class="p" onclick="nextQ()">${s.i+1>=s.list.length?'결과 보기':'다음 문제 ▶'}</button></div></div>`}
function nextQ(){sess.i++;sess.picked=null;quizView()}
function result(){const s=sess,c=s.res.filter(x=>x.ok).length,bad=s.res.filter(x=>!x.ok);
  $('#app').innerHTML=`<div class="card"><h2>${s.title} 결과</h2><div class="stats"><div class="stat"><b>${c} / ${s.res.length}</b>정답</div><div class="stat"><b>${Math.round(c/s.res.length*100)}%</b>정답률</div></div>
   <div class="row"><button class="p" onclick="go('wrong')">오답노트 보기 (${bad.length})</button><button onclick="sess=null;go('')">처음으로</button>
   ${bad.length?`<button onclick="begin(ordered(sess.res.filter(x=>!x.ok).map(x=>byId[x.id])),'틀린 문제 다시')">틀린 문제 다시 풀기</button>`:''}</div></div>`}
let wf={era:'',hideDone:true,sort:'num'};
function wrongView(){
  let ids=Object.keys(rec).filter(id=>rec[id].w>0&&byId[id]);
  const all=ids.slice();
  if(wf.hideDone)ids=ids.filter(id=>!rec[id].done);
  if(wf.era)ids=ids.filter(id=>era(byId[id])===wf.era);
  ids.sort((a,b)=>wf.sort==='count'?rec[b].w-rec[a].w:(byId[a].r*100+byId[a].n)-(byId[b].r*100+byId[b].n));
  const eraN={};all.filter(id=>!rec[id].done).forEach(id=>{const e=era(byId[id]);eraN[e]=(eraN[e]||0)+1});
  $('#app').innerHTML=`<div class="card"><h2>오답노트</h2>
  <div class="sub">틀린 문제가 자동으로 쌓여요. 완전히 이해하면 '정복'을 눌러 숨기세요.</div>
  <div class="row"><div class="chips"><span class="chip ${wf.era?'':'on'}" onclick="wf.era='';wrongView()">전체 ${all.filter(id=>!rec[id].done).length}</span>${ERAS.filter(e=>eraN[e]).map(e=>`<span class="chip ${wf.era===e?'on':''}" onclick="wf.era='${e}';wrongView()">${e} ${eraN[e]}</span>`).join('')}</div></div>
  <div class="row"><label><input type="checkbox" ${wf.hideDone?'checked':''} onchange="wf.hideDone=this.checked;wrongView()"> 정복한 문제 숨기기</label>
   <select onchange="wf.sort=this.value;wrongView()"><option value="num" ${wf.sort=='num'?'selected':''}>회차 순</option><option value="count" ${wf.sort=='count'?'selected':''}>많이 틀린 순</option></select>
   <button class="p" ${ids.length?'':'disabled'} onclick='begin(ordered(${JSON.stringify(ids)}.map(i=>byId[i])),"오답 다시 풀기")'>이 목록 다시 풀기 (${ids.length})</button></div></div>
  ${ids.length?'':'<div class="card sub">표시할 오답이 없어요.</div>'}
  ${ids.map(id=>{const q=byId[id],r=rec[id];return `<div class="card"><div class="meta"><b>제${q.r}회 ${q.n}번</b><span class="tag">${era(q)}</span><span>틀린 횟수 ${r.w} · 푼 횟수 ${r.t}</span></div>
   <div class="wn"><div class="qimg"><img loading="lazy" src="q/${id}.jpg"></div><div>
   <div>정답 <b class="good">${q.a}번</b> ${r.last?` · 내가 고른 답 <b class="badc">${r.last}번</b>`:''}</div>
   <div class="row"><span class="sub">시대</span><select onchange="setEra('${id}',this.value)">${ERAS.map(e=>`<option ${era(q)===e?'selected':''}>${e}</option>`).join('')}</select></div>
   <textarea placeholder="왜 틀렸는지, 외울 포인트를 적어두세요" oninput="note('${id}',this.value)">${(r.note||'').replace(/</g,'&lt;')}</textarea>
   <div class="row"><button onclick="toggleDone('${id}')">${r.done?'정복 취소':'✔ 정복'}</button><button onclick="begin([byId['${id}']],'한 문제')">다시 풀기</button></div></div></div></div>`}).join('')}`}
function note(id,v){R(id).note=v;save()}
function setEra(id,v){R(id).era=v;save()}
function toggleDone(id){const r=R(id);r.done=r.done?0:1;save();wrongView()}
route();
</script></body></html>
